<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Dashboard Concesionario</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Panel de Control - Auto Zayn</h1>
        
        <div class="row text-center">
            <!-- Tarjeta de Autos -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-primary text-white mb-3">
                    <div class="card-body">
                        <h3>Autos Registrados</h3>
                        <p class="display-4">{{ total_autos }}</p>
                    </div>
                </div>
            </div>
            <!-- Tarjeta de Ventas -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-success text-white mb-3">
                    <div class="card-body">
                        <h3>Ventas Totales</h3>
                        <p class="display-4">{{ total_ventas }}</p>
                    </div>
                </div>
            </div>
            <!-- Tarjeta de Clientes -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-info text-white mb-3">
                    <div class="card-body">
                        <h3>Clientes</h3>
                        <p class="display-4">{{ total_clientes }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
